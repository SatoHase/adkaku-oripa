# オリくじ — Nuxt(Vue)。JSON APIなし（一覧はSSR/クライアント描画）。一覧はDOM抽出、最低保証はサムネイル画像内のみ → 画像判定で補完
# 一覧カードのテキストは "10,000 /1回 残り 1,403 / 3,000"。新規限定は「新規登録から○○限定で引ける!」の表記
# robots.txt は空（制限なし）。ジャンルは /gacha/<genre>（gundam・weiss・yugioh 等もあるが categories.yml にある商材のみ収集）
name: オリくじ
enabled: true
listings:
  - { category: pokemon,  url: https://orikuji.com/gacha/pokemon }
  - { category: onepiece, url: https://orikuji.com/gacha/onepiece }
# A8リンク。{url} がオリパ詳細ページURLに置換される（a8ejpredirect で詳細ページ直リンク。動作確認済み）
affiliate_url_template: "https://px.a8.net/svt/ejp?a8mat=4BC9F4+69NB1U+5I52+BW0YB&a8ejpredirect={url}"
wait_ms: 8000

dom:
  item_selector: ".card-outer"
  fields:
    id: { selector: "[data-gacha-id]", attr: data-gacha-id }
    detail_url: { selector: "a[href*='/gacha/']", attr: href, regex: "^([^?#]+)" }
    banner_url: { selector: ".image-container img", attr: src, regex: "^([^?#]+)" }
    price: { text: true, regex: "([0-9,]+)\\s*/\\s*1回" }
    stock_left: { text: true, regex: "残り\\s*([0-9,]+)" }
    stock_total: { text: true, regex: "残り\\s*[0-9,]+\\s*/\\s*([0-9,]+)" }
    new_user_only: { text: true, regex: "(新規登録から|新規限定|初回限定|WELCOME)" }

vision:
  image_field: banner_url
  unit: 円   # コイン表記。1コイン=1円換算

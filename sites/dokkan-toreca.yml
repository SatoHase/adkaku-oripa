# どっかんトレカ — Next.js(RSC)。JSON APIなし。一覧はDOM抽出、名前・最低保証はバナー画像内のみ → 画像判定で補完
name: どっかんトレカ
enabled: true
# 商材ごとの一覧ページ（SITE_LISTING）。category は categories.yml の category_id
listings:
  - { category: pokemon,  url: https://dokkan-toreca.com/ }
  - { category: onepiece, url: https://dokkan-toreca.com/one-piece }
# A8リンク。{url} がオリパ詳細ページURL（エンコード済み）に置換され、a8ejpredirect で詳細ページに直接遷移する（動作確認済み）
affiliate_url_template: "https://px.a8.net/svt/ejp?a8mat=4BC9F4+6A8QNM+5PLE+5Z6WX&a8ejpredirect={url}"
wait_ms: 8000

dom:
  item_selector: "li:has(a[href^='/gachasystems/'])"
  fields:
    id: { selector: "a[href^='/gachasystems/']", attr: href, regex: "/gachasystems/(\\d+)" }
    detail_url: { selector: "a[href^='/gachasystems/']", attr: href }
    banner_url: { selector: "img[alt='bannerImage']", attr: src }
    # カード内テキストは "1 口 10,000 PT 残 70 / 1,000" の形
    price: { text: true, regex: "([0-9,]+)\\s*PT" }
    stock_left: { text: true, regex: "残\\s*([0-9,]+)" }
    stock_total: { text: true, regex: "残\\s*[0-9,]+\\s*/\\s*([0-9,]+)" }
    # 新規登録限定タグ（カード内に文言があれば true）。無ければ vision の読取結果でも判定する
    new_user_only: { text: true, regex: "(新規限定|新規登録|初回限定|WELCOME)" }

# バナー画像から name / guarantee_text を読む（新規レコードのみ実行。1件あたり数円）
vision:
  image_field: banner_url
  unit: PT   # このサイトの通貨単位。1PT=1円換算で扱う

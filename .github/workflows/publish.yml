name: publish
on:
  repository_dispatch:
    types: [approved]
  workflow_dispatch:
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: npm run export
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
      - run: cd site && npm install --no-audit --no-fund && npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=adkaku-oripa
      # X投稿はSecretsが揃っている時だけ実行（未設定ならスキップ）
      - id: xcheck
        run: echo "enabled=${{ secrets.X_API_KEY != '' && secrets.X_ACCESS_TOKEN != '' }}" >> $GITHUB_OUTPUT
      - if: steps.xcheck.outputs.enabled == 'true'
        run: npm run post
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
